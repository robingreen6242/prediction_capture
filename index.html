<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S&amp;P Predict">
<title>S&amp;P Market Predictions</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #101A2E;
  --muted: #5B6679;
  --line: #D5DAE3;
  --tick: #C3CAD6;
  --up: #0B7A75;
  --down: #B3382C;
  --on-color: #FFFFFF;
  --btn-bg: #101A2E;
  --btn-fg: #FFFFFF;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1626;
    --surface: #17223A;
    --ink: #EAF0FA;
    --muted: #93A0B8;
    --line: #2A3856;
    --tick: #2A3856;
    --up: #3CC4B9;
    --down: #F28B82;
    --on-color: #08121F;
    --btn-bg: #EAF0FA;
    --btn-fg: #0E1626;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--up); outline-offset: 2px; }

.wrap {
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
}

h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.02em;
}

/* Buttons */
.btn {
  min-height: 56px;
  padding: 0 20px;
  border-radius: var(--radius);
  border: 2px solid var(--btn-bg);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-weight: 700;
  font-size: 18px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: 0.35; cursor: default; }
.link {
  background: none;
  border: 0;
  padding: 8px 0;
  color: var(--muted);
  font-size: 15px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Start screen */
#start { flex: 1; flex-direction: column; }
#start:not([hidden]) { display: flex; }
#start .top { margin-top: 12vh; }
#start .panel { margin-top: 36px; display: grid; gap: 14px; }
label.field { font-weight: 600; font-size: 15px; color: var(--muted); }
input[type="date"] {
  width: 100%;
  min-height: 56px;
  margin-top: 8px;
  padding: 0 16px;
  font-size: 20px;
  font-weight: 600;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius);
}
.resume { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
.resume strong { display: block; font-size: 20px; }
.resume span { color: var(--muted); }
.status { margin-top: auto; padding-top: 24px; color: var(--muted); font-size: 15px; min-height: 1.4em; }

/* Quiz */
#quiz { flex: 1; flex-direction: column; }
#quiz:not([hidden]) { display: flex; }
.ticks { display: flex; align-items: flex-end; gap: 2px; height: 18px; margin-top: 6px; }
.ticks span { flex: 1; height: 6px; border-radius: 2px; background: var(--tick); }
.ticks span.u { background: var(--up); }
.ticks span.d { background: var(--down); }
.ticks span.cur { height: 18px; }
.ticks span.cur:not(.u):not(.d) { background: var(--ink); }
.meta { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 15px; }

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; }
.swap.in { animation: slide 150ms ease-out; }
@keyframes slide { from { opacity: 0; transform: translateX(var(--dx, 14px)); } to { opacity: 1; transform: none; } }
.time {
  font-size: clamp(52px, 18vw, 88px);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.question { margin: 16px 0 0; font-size: 21px; font-weight: 500; line-height: 1.3; }

.choices { display: grid; grid-template-columns: 1fr; gap: 12px; }
.choice {
  min-height: 84px;
  border-radius: var(--radius);
  border: 2px solid var(--line);
  background: var(--surface);
  font-size: 28px;
  font-weight: 800;
}
.choice.up { color: var(--up); }
.choice.down { color: var(--down); }
.choice[aria-pressed="true"].up { background: var(--up); border-color: var(--up); color: var(--on-color); }
.choice[aria-pressed="true"].down { background: var(--down); border-color: var(--down); color: var(--on-color); }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-top: 12px; }

/* Done */
#done { flex: 1; flex-direction: column; justify-content: center; }
#done:not([hidden]) { display: flex; }
#done p { color: var(--muted); margin: 12px 0 28px; }

@media (prefers-reduced-motion: reduce) { .swap.in { animation: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Start -->
  <section id="start">
    <div class="top"><h1>S&amp;P Market Predictions</h1></div>
    <div class="panel" id="datePanel">
      <div>
        <label class="field" for="date">Active date</label>
        <input type="date" id="date">
      </div>
      <button class="btn" id="startBtn" type="button">Start predictions</button>
    </div>
    <div class="panel" id="resumePanel" hidden>
      <div class="resume">
        <strong id="resumeDate"></strong>
        <span id="resumeCount"></span>
      </div>
      <button class="btn" id="resumeBtn" type="button">Resume</button>
      <button class="link" id="discardBtn" type="button">Discard and start a new date</button>
    </div>
    <div class="status" id="startStatus" role="status"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="meta"><span id="count"></span><span id="qdate"></span></div>

    <div class="stage">
      <div class="swap" id="swap" aria-live="polite">
        <div class="time" id="time"></div>
        <p class="question" id="question"></p>
      </div>
    </div>

    <div class="choices">
      <button class="choice up" id="up" type="button" aria-pressed="false">Up</button>
      <button class="choice down" id="down" type="button" aria-pressed="false">Down</button>
    </div>
    <div class="nav">
      <button class="btn ghost" id="back" type="button">Back</button>
      <button class="btn" id="next" type="button" disabled>Next</button>
    </div>
  </section>

  <!-- Done -->
  <section id="done">
    <h1 id="doneTitle">Saved</h1>
    <p id="doneText"></p>
    <button class="btn" id="againBtn" type="button">New predictions</button>
    <div class="status" id="doneStatus" role="status"></div>
  </section>

</div>

<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const CFG = window.APP_CONFIG || {};
  const KEY_DRAFT = 'spp.draft';
  const KEY_QUEUE = 'spp.queue';

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // 07:30 to 21:00 every 30 minutes = 28 slots. Headers: A..Z, then ZA, ZB.
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const slots = [];
  for (let m = 7 * 60 + 30, i = 0; m <= 21 * 60; m += 30, i++) {
    slots.push({ time: pad(Math.floor(m / 60)) + ':' + pad(m % 60), code: i < 26 ? letters[i] : 'Z' + letters[i - 26] });
  }
  const N = slots.length;

  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const fmtDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  };
  const fmtShort = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));

  let state = null; // { date, answers[N], index }

  function show(name) {
    ['start', 'quiz', 'done'].forEach((s) => { $(s).hidden = s !== name; });
    window.scrollTo(0, 0);
  }
  const persist = () => store.set(KEY_DRAFT, state);

  // ---------- Start ----------
  function validDraft(d) {
    return d && typeof d.date === 'string' && Array.isArray(d.answers) && d.answers.length === N && Number.isInteger(d.index);
  }
  function renderStart() {
    const draft = store.get(KEY_DRAFT, null);
    const has = validDraft(draft);
    $('datePanel').hidden = has;
    $('resumePanel').hidden = !has;
    if (has) {
      const done = draft.answers.filter(Boolean).length;
      $('resumeDate').textContent = fmtDate(draft.date);
      $('resumeCount').textContent = done + ' of ' + N + ' answered';
    } else if (!$('date').value) {
      $('date').value = todayISO();
    }
    updateStatus();
    show('start');
  }

  function startNew() {
    state = { date: $('date').value || todayISO(), answers: new Array(N).fill(null), index: 0 };
    persist();
    renderQuiz(false, 1);
    show('quiz');
  }

  // ---------- Quiz ----------
  function buildTicks() {
    const t = $('ticks');
    t.innerHTML = '';
    for (let i = 0; i < N; i++) t.appendChild(document.createElement('span'));
  }

  function renderQuiz(animate, dir) {
    const slot = slots[state.index];
    const a = state.answers[state.index];
    $('count').textContent = (state.index + 1) + ' of ' + N;
    $('qdate').textContent = fmtDate(state.date);
    $('time').textContent = slot.time;
    $('question').textContent = 'S&P 500 direction on ' + fmtShort(state.date);
    $('up').setAttribute('aria-pressed', String(a === 'Up'));
    $('down').setAttribute('aria-pressed', String(a === 'Down'));
    $('next').disabled = !a;
    $('next').textContent = state.index === N - 1 ? 'Submit' : 'Next';
    $('back').disabled = state.index === 0;
    Array.prototype.forEach.call($('ticks').children, (el, i) => {
      const v = state.answers[i];
      el.className = (i === state.index ? 'cur ' : '') + (v === 'Up' ? 'u' : v === 'Down' ? 'd' : '');
    });
    if (animate) {
      const c = $('swap');
      c.style.setProperty('--dx', dir > 0 ? '14px' : '-14px');
      c.classList.remove('in');
      void c.offsetWidth;
      c.classList.add('in');
    }
  }

  function choose(v) {
    state.answers[state.index] = v;
    persist();
    renderQuiz(false, 1);
  }
  function next() {
    if (!state.answers[state.index]) return;
    if (state.index === N - 1) return submit();
    state.index++;
    persist();
    renderQuiz(true, 1);
  }
  function back() {
    if (state.index === 0) return;
    state.index--;
    persist();
    renderQuiz(true, -1);
  }

  function submit() {
    const item = { id: uid(), date: state.date, submittedAt: new Date().toISOString(), answers: state.answers.slice() };
    const q = store.get(KEY_QUEUE, []);
    q.push(item);
    store.set(KEY_QUEUE, q);
    store.del(KEY_DRAFT);
    $('doneText').textContent = 'Predictions for ' + fmtDate(item.date) + ' are in.';
    state = null;
    show('done');
    updateStatus();
    flush();
  }

  // ---------- Upload queue ----------
  let flushing = false;
  let lastError = '';

  async function send(item) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    let res;
    try {
      res = await fetch(CFG.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
        body: JSON.stringify({ key: CFG.key, id: item.id, date: item.date, submittedAt: item.submittedAt, answers: item.answers }),
        redirect: 'follow',
        signal: ctl.signal
      });
    } finally { clearTimeout(timer); }
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('Unexpected reply from Google. Check the script is deployed for "Anyone".'); }
    if (!out || !out.ok) throw new Error('Sheet rejected the upload: ' + ((out && out.error) || 'unknown error'));
  }

  async function flush() {
    if (flushing || !CFG.endpoint) return;
    flushing = true;
    try {
      for (;;) {
        const q = store.get(KEY_QUEUE, []);
        if (!q.length) break;
        const item = q[0];
        try {
          await send(item);
          lastError = '';
        } catch (err) {
          lastError = (err instanceof TypeError || err.name === 'TypeError' || err.name === 'AbortError') ? 'No connection. Will retry.' : err.message;
          break;
        }
        store.set(KEY_QUEUE, store.get(KEY_QUEUE, []).filter((x) => x.id !== item.id));
      }
    } finally {
      flushing = false;
      updateStatus();
    }
  }

  function updateStatus() {
    const n = store.get(KEY_QUEUE, []).length;
    let text = '';
    if (!CFG.endpoint) {
      text = n ? n + ' saved on this phone. Google Sheets is not connected yet.' : 'Google Sheets is not connected yet. Answers stay on this phone.';
    } else if (n) {
      text = n + ' waiting to upload.' + (lastError ? ' ' + lastError : '');
    }
    $('startStatus').textContent = text;
    $('doneStatus').textContent = text;
    $('doneTitle').textContent = (CFG.endpoint && !n) ? 'Uploaded' : 'Saved';
  }

  // ---------- Wiring ----------
  $('startBtn').addEventListener('click', startNew);
  $('resumeBtn').addEventListener('click', () => {
    const d = store.get(KEY_DRAFT, null);
    if (!validDraft(d)) return renderStart();
    state = d;
    renderQuiz(false, 1);
    show('quiz');
  });
  $('discardBtn').addEventListener('click', () => {
    if (confirm('Discard the unfinished predictions?')) { store.del(KEY_DRAFT); renderStart(); }
  });
  $('up').addEventListener('click', () => choose('Up'));
  $('down').addEventListener('click', () => choose('Down'));
  $('next').addEventListener('click', next);
  $('back').addEventListener('click', back);
  $('againBtn').addEventListener('click', renderStart);

  window.addEventListener('online', flush);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
  setInterval(flush, 30000);

  buildTicks();
  renderStart();
  flush();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
